name: Build and publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so OS-level patches keep landing without a code change.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out the image tags
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"
          # A tag like v1.0.0 also publishes ghcr.io/owner/nextup:1.0.0, so an
          # install can pin a version instead of always taking latest.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_TAG=ghcr.io/$OWNER_LC/nextup:${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_TAG=ghcr.io/$OWNER_LC/nextup:${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/nextup:latest
            ghcr.io/${{ env.OWNER_LC }}/nextup:${{ github.sha }}
            ${{ env.VERSION_TAG }}
