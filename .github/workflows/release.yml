# Runs the tests, then builds the image and publishes it to this repository's
name: Publish the image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, for example 1.5.2'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TYPED: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$TYPED"
          else
            version="${REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.]*|"") echo "Not a version number: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

          newest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ "$version" = "$newest" ] || [ -z "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check it matches the VERSION file
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          have="$(cat VERSION)"
          if [ "$WANT" != "$have" ]; then
            echo "Tag says $WANT but VERSION says $have. Fix one of them."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}

      - name: Install Trivy (checksum checked)
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy

      - name: Scan the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
        run: ./trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          docker push "$IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
