# Runs the tests, then builds the image and publishes it to this repository's
# own container registry. The job uses the token GitHub hands to the workflow,
# which already carries permission to write packages, so no personal token is
# involved. Actions are pinned to commit hashes, with the tag they came from
# beside each one.
name: Publish the image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, for example 1.5.2'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Inputs reach the shell through the environment, never pasted into the
      # script text.
      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TYPED: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$TYPED"
          else
            version="${REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.]*|"") echo "Not a version number: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # "latest" only moves for the newest version, so publishing an older
          # one again cannot put old code under that name.
          newest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ "$version" = "$newest" ] || [ -z "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check it matches the VERSION file
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          have="$(cat VERSION)"
          if [ "$WANT" != "$have" ]; then
            echo "Tag says $WANT but VERSION says $have. Fix one of them."
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
