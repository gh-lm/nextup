# Runs the tests, then builds the image and publishes it to this repository's
name: Publish the image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, for example 1.5.2'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TYPED: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$TYPED"
          else
            version="${REF_NAME#v}"
          fi
          case "$version" in
            *[!0-9.]*|"") echo "Not a version number: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

          newest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ "$version" = "$newest" ] || [ -z "$newest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check it matches the VERSION file
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          have="$(cat VERSION)"
          if [ "$WANT" != "$have" ]; then
            echo "Tag says $WANT but VERSION says $have. Fix one of them."
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}

      - name: Install Trivy (checksum checked)
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy

      - name: Scan the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
        run: ./trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          docker push "$IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
