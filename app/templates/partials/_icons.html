{# Line icons, drawn rather than typed. A glyph like a star pasted #}

{% macro star() -%}
<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="m12 3.6 2.5 5.3 5.7.8-4.1 4.1 1 5.8-5.1-2.8-5.1 2.8 1-5.8L3.8 9.7l5.7-.8z"/>
</svg>
{%- endmacro %}

{% macro tv() -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 18v3"/>
</svg>
{%- endmacro %}

{% macro eye() -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
</svg>
{%- endmacro %}

{% macro clock() -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
</svg>
{%- endmacro %}

{% macro film() -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>
</svg>
{%- endmacro %}
