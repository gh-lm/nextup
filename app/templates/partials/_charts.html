{# Small charts drawn beside the dashboard numbers. Plain SVG, no script. #}
{% macro columns(values, label) -%}
{% set top = values|max or 1 %}
<svg class="chart chart-columns" viewBox="0 0 {{ values|length * 10 - 3 }} 40" role="img" aria-label="{{ label }}">
  {% for v in values %}
    {% set h = ((v / top) * 38)|round(0, 'ceil')|int if v else 0 %}
    <rect class="chart-base" x="{{ loop.index0 * 10 }}" y="38" width="7" height="2" rx="1"></rect>
    {% if h %}<rect class="chart-bar" x="{{ loop.index0 * 10 }}" y="{{ 40 - h }}" width="7" height="{{ h }}" rx="1.5"></rect>{% endif %}
  {% endfor %}
</svg>
{%- endmacro %}

{% macro ring(part, whole, label) -%}
{% set share = (part / whole * 100) if whole else 0 %}
<svg class="chart chart-ring" viewBox="0 0 40 40" role="img" aria-label="{{ label }}">
  <circle class="chart-base" cx="20" cy="20" r="15" fill="none" stroke-width="6"></circle>
  {% if share %}<circle class="chart-bar" cx="20" cy="20" r="15" fill="none" stroke-width="6" pathLength="100"
          stroke-dasharray="{{ '%.1f'|format(share) }} 100" transform="rotate(-90 20 20)"></circle>{% endif %}
</svg>
{%- endmacro %}
