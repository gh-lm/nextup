{% import 'partials/_icons.html' as icons %}
{% macro note(item) -%}
<p class="note note-{{ item.kind }}" role="status">
  <span class="note-mark">{{ icons.alert() if item.kind == 'error' else icons.tick() }}</span>
  <span>{{ item.message }}</span>
</p>
{%- endmacro %}

{% macro notes_for(items, panel) -%}
  {% for item in items if item.panel == panel %}{{ note(item) }}{% endfor %}
{%- endmacro %}
