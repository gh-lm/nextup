{# A quiet line of confirmation, shown beside whatever caused it rather than as #}
{% macro note(item, live=true) -%}
<p class="note note-{{ item.kind }}"{% if live %} role="status"{% endif %}>{{ item.message }}</p>
{%- endmacro %}

{% macro notes_for(items, panel) -%}
  {% for item in items if item.panel == panel %}{{ note(item) }}{% endfor %}
{%- endmacro %}
