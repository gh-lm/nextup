{# Cycles light -> dark -> follow the system. Works without JavaScript. #}
{% set next_theme = 'dark' if theme == 'light' else ('' if theme == 'dark' else 'light') %}
<form method="post" action="{{ url_for('settings.theme') }}">
  <input type="hidden" name="theme" value="{{ next_theme }}">
  <input type="hidden" name="next" value="{{ request.full_path }}">
  <button class="btn btn-quiet btn-small" type="submit"
          title="Appearance: {{ theme or 'follows your system' }}. Switch to {{ next_theme or 'follow your system' }}."
          aria-label="Appearance: {{ theme or 'follows your system' }}. Switch to {{ next_theme or 'follow your system' }}.">
    {% if theme == 'light' %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
      </svg>
      <span>Light</span>
    {% elif theme == 'dark' %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
      <span>Dark</span>
    {% else %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8"/>
      </svg>
      <span>Auto</span>
    {% endif %}
  </button>
</form>
