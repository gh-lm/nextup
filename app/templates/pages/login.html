{% extends 'layout/base.html' %}
{% block title %}Sign in | Nextup{% endblock %}
{% block body %}
<div class="login">
  <div class="login-head">
    <h1>Nextup</h1>
    <p class="subtle">What to watch next, and when it airs.</p>
  </div>
  <form class="panel" method="post">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required{% if not error %} autofocus{% endif %}>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             aria-describedby="sign-in-error"{% if error %} aria-invalid="true" autofocus{% endif %}>
      <input type="hidden" name="timezone" value="" data-timezone>
            <p class="sign-in-error" id="sign-in-error">{{ error or "" }}</p>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
