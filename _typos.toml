[default]
locale = "en-gb"

[default.extend-words]
# CSS, SVG and HTML keywords are American by definition
color = "color"
center = "center"
behavior = "behavior"
# schema.org type name
Organization = "Organization"
# a status value TMDB sends
canceled = "canceled"
# a TV series title
Reacher = "Reacher"
# a variable name in a drawing script
ax = "ax"

[files]
extend-exclude = ["LICENSE", "docs/licence.txt", "docs/licence.html"]
