services:
  nextup:
    image: ghcr.io/lightmorphic/nextup:latest
    container_name: nextup
    restart: unless-stopped
    ports:
      - "127.0.0.1:4090:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /opt/nextup:/data
    environment:
      NEXTUP_SYNC_HOURS: "12"
      TZ: "Europe/London"
