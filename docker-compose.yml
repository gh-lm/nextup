services:
  nextup:
    image: ghcr.io/lightmorphic/nextup:latest
    container_name: nextup
    restart: unless-stopped
    ports:
      - "4090:8080"
    volumes:
      - /opt/nextup:/data
    environment:
      # Hours between automatic refreshes of tracked shows.
      NEXTUP_SYNC_HOURS: "12"
      # The morning email and "what is available today" both read the clock,
      # so set this to your own timezone rather than leaving it on UTC.
      TZ: "Europe/London"
